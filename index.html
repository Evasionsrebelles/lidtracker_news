<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokelids — Bulletin d'infos</title>
<style>
  :root {
    --accent: #F16102;
    --text: #1A1A2E;
    --muted: #767676;
    --border: #E5E5E5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 96px;
    height: 96px;
    display: block;
    margin: 0 auto 20px;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    text-align: center;
  }

  .timestamp {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 24px;
  }

  .lang-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }

  .lang-switch button {
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }

  .lang-switch button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  ul.bulletin {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.bulletin li {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    line-height: 1.5;
  }

  ul.bulletin li:before {
    content: "📌";
    margin-right: 8px;
  }

  ul.bulletin li:last-child {
    border-bottom: none;
  }

  .empty, .error {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    padding: 24px 0;
  }
</style>
</head>
<body>

  <img src="logo.png" alt="Pokelids" class="logo">

  <h1>Bulletin d'infos</h1>
  <p class="timestamp" id="timestamp">—</p>

  <div class="lang-switch">
    <button data-lang="fr" class="active">FR</button>
    <button data-lang="en">EN</button>
    <button data-lang="jp">JP</button>
  </div>

  <main>
    <ul class="bulletin" id="bulletin"></ul>
  </main>

  <script>
    let currentLang = 'fr';
    let newsData = null;

    const bulletinEl = document.getElementById('bulletin');
    const timestampEl = document.getElementById('timestamp');
    const buttons = document.querySelectorAll('.lang-switch button');

    function formatTimestamp(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString(undefined, {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch (e) {
        return iso;
      }
    }

    function render() {
      if (!newsData) return;
      timestampEl.textContent = 'Dernière mise à jour : ' + formatTimestamp(newsData.timestamp);

      const lines = newsData[currentLang] || [];
      bulletinEl.innerHTML = '';

      if (lines.length === 0) {
        bulletinEl.innerHTML = '<li class="empty">Aucune actualité pour le moment.</li>';
        return;
      }

      lines.forEach(function (line) {
        const li = document.createElement('li');
        li.textContent = line;
        bulletinEl.appendChild(li);
      });
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentLang = btn.dataset.lang;
        buttons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render();
      });
    });

    fetch('news.json', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        newsData = data;
        render();
      })
      .catch(function () {
        bulletinEl.innerHTML = '<li class="error">Impossible de charger le bulletin.</li>';
      });
  </script>

</body>
</html>
